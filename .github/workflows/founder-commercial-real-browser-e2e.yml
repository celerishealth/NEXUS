name: Founder Commercial Real Browser E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founder-commercial-real-browser-e2e
  cancel-in-progress: false

jobs:
  verify:
    name: Verify isolated founder commercial browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: nexus-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Resolve local browser executable
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "${candidate}" >/dev/null 2>&1; then
              echo "NEXUS_LOCAL_BROWSER_EXECUTABLE=$(command -v "${candidate}")" >> "${GITHUB_ENV}"
              exit 0
            fi
          done
          echo "::error::No supported local browser executable is available."
          exit 1

      - name: Verify isolated founder commercial real-browser flow
        run: npm run test:founder-emergency-http
